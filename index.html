document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-transform:uppercase;color:#8a8a90\">Segundo premio<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-size:1.2rem;font-weight:800;margin:0 0 8px;line-height:1.25\">Freidora de aire<\u002Fh3>\n        <p style=\"font-size:13.5px;color:#5c5c62;line-height:1.55;margin:0\">Para el segundo número sorteado.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #ECECEE;border-radius:22px;overflow:hidden;transition:transform .25s,box-shadow .25s\" style-hover=\"transform:translateY(-6px);box-shadow:0 18px 36px rgba(0,0,0,.09)\">\n      <div style=\"height:170px;position:relative;background:#FAFAFA\">\n        <image-slot id=\"premio-3\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto o diseño de la gift card\" style=\"position:absolute;inset:0;width:100%;height:100%\" src=\"3a5d3ab0-df81-492b-9410-deb3d91a818e\"><\u002Fimage-slot>\n        <span style=\"position:absolute;bottom:10px;left:10px;background:rgba(255,255,255,.92);border:1px solid #ECECEE;color:#5c5c62;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:100px\">Imagen de referencia<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:24px\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\">\n          <span style=\"width:28px;height:28px;border-radius:50%;background:#17171c;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center\">3°<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8a8a90\">Tercer premio<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-size:1.2rem;font-weight:800;margin:0 0 8px;line-height:1.25\">Gift Card de $50.000<\u002Fh3>\n        <p style=\"font-size:13.5px;color:#5c5c62;line-height:1.55;margin:0\">Para el tercer número sorteado.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"rf-shell\" style=\"max-width:1240px;margin:0 auto;padding-bottom:20px\">\n  <div class=\"rf-info\">\n    <sc-for list=\"{{ infoCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n      <div style=\"background:#FAFAFA;border:1px solid #ECECEE;border-radius:18px;padding:24px;transition:transform .25s,box-shadow .25s\" style-hover=\"transform:translateY(-4px);box-shadow:0 16px 32px rgba(0,0,0,.07)\">\n        <div style=\"width:28px;height:4px;background:#C8102E;border-radius:100px;margin-bottom:18px\"><\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a8a90;margin-bottom:8px\">{{ c.label }}<\u002Fdiv>\n        <div style=\"font-size:1.45rem;font-weight:800;line-height:1.15;color:#17171c\">{{ c.value }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:#5c5c62;line-height:1.5;margin-top:8px\">{{ c.note }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"numeros\" class=\"rf-shell\" style=\"max-width:1240px;margin:0 auto;padding-top:56px;padding-bottom:60px\">\n  <div style=\"margin-bottom:26px\">\n    <h2 class=\"rf-h2\" style=\"font-weight:800;margin:0 0 10px;line-height:1.15\">Elige tu número<\u002Fh2>\n    <p style=\"font-size:15px;line-height:1.6;color:#5c5c62;margin:0;max-width:520px\">Del {{ primerNumero }} al {{ ultimoNumero }}. Toca los que quieras llevar: puedes elegir uno o varios. Los números en gris ya están tomados.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"rf-pickwrap\">\n    <div style=\"flex:1;min-width:0\">\n      <div style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:16px\">\n        <div style=\"position:relative;flex:1;min-width:200px\">\n          <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQueryChange }}\" sc-camel-input-mode=\"numeric\" placeholder=\"Buscar un número, ej: 127\" style=\"width:100%;padding:12px 16px;border-radius:12px;border:1px solid #E6E6E8;background:#FAFAFA;font-size:14.5p    <sc-if value=\"{{ b.destacado }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:14.5px;line-height:1.65;color:#17171c;font-weight:800;margin:0;text-wrap:pretty\">{{ b.text }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<footer style=\"background:#0F0F12;padding-top:48px;padding-bottom:32px\">\n  <div class=\"rf-shell\" style=\"max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between\">\n    <div style=\"background:#fff;border-radius:10px;padding:8px 14px;display:inline-flex\"><img src=\"1c0c7b54-a57a-42fd-be2a-f42f12b7e9ca\" alt=\"Ayres Security\" style=\"height:28px;width:auto;display:block\"><\u002Fdiv>\n    <span style=\"font-size:12.5px;color:rgba(255,255,255,.4)\">© 2026 Ayres Security · Plataforma de rifas internas<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ confirmOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:100;background:rgba(10,10,12,.62);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px\" sc-camel-on-click=\"{{ closeConfirm }}\">\n    <div style=\"background:#fff;border-radius:24px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;animation:modalIn .32s cubic-bezier(.2,.7,.3,1) both\" sc-camel-on-click=\"{{ stopClick }}\">\n      <div style=\"background:#0F0F12;padding:34px 30px;text-align:center;position:relative;overflow:hidden\">\n        <div style=\"position:absolute;top:-90px;right:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(200,16,46,.4),transparent 70%)\"><\u002Fdiv>\n        <div style=\"position:relative\">\n          <div style=\"width:52px;height:52px;border-radius:50%;background:#C8102E;color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 18px\">✓<\u002Fdiv>\n          <h3 style=\"font-size:1.5rem;font-weight:800;color:#fff;margin:0 0 8px\">¡Ya estás participando!<\u002Fh3>\n          <p style=\"font-size:14px;color:rgba(255,255,255,.6);margin:0;line-height:1.5\">Guarda tu código. Te escribimos por WhatsApp el día del sorteo.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:28px\">\n        <div style=\"background:#FAFAFA;border:1px dashed #E6E6E8;border-radius:16px;padding:20px;text-align:center;margin-bottom:16px\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8a8a90;margin-bottom:10px\">Tus números<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:18px\">\n            <sc-for list=\"{{ confirmNumbers }}\" as=\"cn\" hint-placeholder-count=\"3\">\n              <span style=\"background:#17171c;color:#fff;font-weight:800;font-size:13.5px;padding:7px 12px;border-radius:8px\">{{ cn.label }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8a8a90;margin-bottom:6px\">Código de participación<\u002Fdiv>\n          <div style=\"font-size:1.6rem;font-weight:800;letter-spacing:-.01em;color:#17171c\">{{ codigoParticipacion }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px;border-top:1px solid #ECECEE\">\n          <span style=\"font-size:14px;color:#5c5c62;font-weight:600\">{{ confirmCount }} números · total<\u002Fspan>\n          <span style=\"font-size:1.2rem;font-weight:800\">{{ confirmTotal }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 4px;border-top:1px solid #ECECEE\">\n          <span style=\"font-size:14px;color:#5c5c62;font-weight:600\">Fecha de reserva<\u002Fspan>\n          <span style=\"font-size:13.5px;font-weight:700;text-align:right\">{{ confirmFecha }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:12px 4px 18px;border-top:1px solid #ECECEE\">\n          <span style=\"font-size:14px;color:#5c5c62;font-weight:600\">Estado del pago<\u002Fspan>\n          <span style=\"font-size:12px;font-weight:700;color:#C8102E;background:#FBE9EC;padding:5px 11px;border-radius:100px\">{{ confirmEstadoPago }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <button sc-camel-on-click=\"{{ shareTicket }}\" style=\"width:100%;border:none;background:#C8102E;color:#fff;font-weight:700;font-size:15px;padding:15px;border-radius:12px;cursor:pointer;box-shadow:0 8px 20px rgba(200,16,46,.28)\" style-hover=\"background:#A50D26\">Compartir<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeConfirm }}\" style=\"width:100%;border:1px solid #E6E6E8;background:#fff;color:#17171c;font-weight:700;font-size:15px;padding:15px;border-radius:12px;cursor:pointer\" style-hover=\"border-color:#17171c\">Volver al inicio<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#17171c;color:#fff;font-weight:600;font-size:14px;padding:14px 24px;border-radius:100px;z-index:200;box-shadow:0 14px 30px rgba(0,0,0,.3)\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;nombreRifa&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rifa Ayres 2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Datos de la rifa&quot;},&quot;totalNumeros&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:800,&quot;min&quot;:100,&quot;max&quot;:2000,&quot;step&quot;:100,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Datos de la rifa&quot;},&quot;precioNumero&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1000,&quot;min&quot;:500,&quot;max&quot;:10000,&quot;step&quot;:500,&quot;unit&quot;:&quot;CLP&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Datos de la rifa&quot;},&quot;showBases&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Secciones&quot;}}\">\n/* ─────────────────────────────────────────────────────────────\n   CAPA DE DATOS — RifaRepository\n   Único punto de contacto con la fuente de datos. Hoy devuelve\n   datos ficticios en memoria; mañana estas mismas tres funciones\n   leerán y escribirán en Google Sheets sin tocar la interfaz.\n   ───────────────────────────────────────────────────────────── */\n\n// Forma del registro de cada número. Es el contrato entre la interfaz\n// y la futura hoja de cálculo: una fila de la hoja = un objeto de estos.\nconst TICKET_SCHEMA = {\n  numero: 'string',              // '001' … '800'\n  estado: 'string',              // 'disponible' | 'reservado' | 'pagado'\n  usuario: 'object|null',        // {nombre, apellido, rut, whatsapp, email}\n  fechaReserva: 'string|null',   // ISO 8601\n  fechaPago: 'string|null',      // ISO 8601\n  estadoPago: 'string',          // 'sin_pago' | 'pendiente' | 'confirmado'\n  codigoParticipacion: 'string|null' // 'AY26-0001'\n};\n\nconst ESTADOS = {DISPONIBLE:'disponible', RESERVADO:'reservado', PAGADO:'pagado'};\nconst ESTADOS_PAGO = {SIN_PAGO:'sin_pago', PENDIENTE:'pendiente', CONFIRMADO:'confirmado'};\n\n/* ── ÚNICO PUNTO DE CONFIGURACIÓN ────────────────────────────── */\nconst API_URL = 'https://script.google.com/macros/s/AKfycbyDYv6lLABdCZZTZT0iSF7x0I-YD_BsR7efEOQIOwpEq8jbO1Swqzmh3fszzJ7JpivwTQ/exec';\n\nconst MIN_LOADING_MS = 500; // piso de duración del estado \"cargando\", solo para que no parpadee\n\nconst MSG_RED = 'No pudimos conectar con el sistema de reservas. Inténtalo nuevamente.';\nconst MSG_TOMADOS = 'Algunos números que seleccionaste ya fueron reservados. Actualizamos la disponibilidad para que puedas elegir nuevamente.';\nconst MSG_DATOS = 'El sistema de reservas respondió, pero no pudimos leer la disponibilidad. Inténtalo nuevamente en un momento.';\n\n// Muestra la fecha ISO del servidor en formato legible en español.\nfunction formatFechaReserva(iso){\n  if(!iso) return '—';\n  const d = new Date(iso);\n  if(isNaN(d.getTime())) return '—';\n  return d.toLocaleDateString('es-CL', {day:'numeric', month:'long', year:'numeric'})\n       + ' · ' + d.toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit'});\n}\n\nfunction etiquetaPago(estado){\n  if(estado === 'confirmado') return 'Confirmado';\n  if(estado === 'pendiente') return 'Pendiente';\n  return estado || '—';\n}\n\n// La petición no llegó a destino: sin conexión, bloqueada o timeout.\nfunction errorDeRed(){\n  const e = new Error(MSG_RED);\n  e.kind = 'red';\n  return e;\n}\n\n// El servidor respondió, pero con algo que no podemos usar: status de error,\n// HTML en vez de JSON, ok:false o falta la propiedad numeros. Es un problema\n// distinto al de conexión y merece otro mensaje.\nfunction errorDeDatos(){\n  const e = new Error(MSG_DATOS);\n  e.kind = 'datos';\n  return e;\n}\n\nconst RifaRepository = {\n  config: {\n    nombre: 'Rifa Ayres 2026',\n    totalNumeros: 800,\n    primerNumero: 1,\n    precioNumero: 1000,\n    fechaCierre: '2026-09-16T00:00:00',\n    fechaCierreTexto: '16 de septiembre a las 00:00 hrs',\n    fechaSorteo: '2026-09-17T00:00:00',\n    fechaSorteoTexto: '17 de septiembre de 2026'\n  },\n\n  padNumero(n){ return String(n).padStart(3,'0'); },\n\n  // Fila vacía, con todos los campos del contrato presentes.\n  emptyTicket(n){\n    return {\n      numero: this.padNumero(n),\n      estado: ESTADOS.DISPONIBLE,\n      usuario: null,\n      fechaReserva: null,\n      fechaPago: null,\n      estadoPago: ESTADOS_PAGO.SIN_PAGO,\n      codigoParticipacion: null\n    };\n  },\n\n  // Normaliza una fila de la hoja al contrato TICKET_SCHEMA.\n  // El GET solo manda {numero, estado}; el resto de los campos se\n  // completan vacíos y se respetan si en el futuro la hoja los envía.\n  mapRow(row){\n    const t = this.emptyTicket(parseInt(row.numero, 10) || 0);\n    t.numero = String(row.numero).padStart(3, '0');\n    t.estado = row.estado || ESTADOS.DISPONIBLE;\n    // Solo se sobreescribe si la hoja mandó un valor real. Un null en el\n    // payload no debe borrar el valor por defecto del contrato.\n    if(row.usuario != null) t.usuario = row.usuario;\n    if(row.fechaReserva != null) t.fechaReserva = row.fechaReserva;\n    if(row.fechaPago != null) t.fechaPago = row.fechaPago;\n    if(row.estadoPago != null) t.estadoPago = row.estadoPago;\n    if(row.codigoParticipacion != null) t.codigoParticipacion = row.codigoParticipacion;\n    return t;\n  },\n\n  // LECTURA — GET a [URL]/exec\n  // Espera {ok:true, numeros:[{numero, estado}]}\n  async fetchTickets(){\n    let res, texto;\n\n    // 1. ¿Salió la petición? Solo esto es un error de conexión.\n    try {\n      res = await fetch(API_URL, {method:'GET', redirect:'follow'});\n      texto = await res.text();\n    } catch(e){\n      console.warn('[rifa] GET: la petición no llegó a destino (red, CORS o bloqueo del navegador).', e);\n      throw errorDeRed();\n    }\n\n    // 2. ¿Respondió con un status usable?\n    if(!res.ok){\n      console.warn('[rifa] GET: el servidor respondió HTTP ' + res.status + '.', texto.slice(0, 300));\n      throw errorDeDatos();\n    }\n\n    // 3. ¿Es JSON? Si llega HTML, casi siempre es la pantalla de login de\n    //    Google: el Web App no está desplegado con acceso \"Cualquier persona\".\n    let data;\n    try {\n      data = JSON.parse(texto);\n    } catch(e){\n      const parece = texto.trim().slice(0, 1).toLowerCase() === '<';\n      console.warn(\n        parece\n          ? '[rifa] GET: llegó HTML en vez de JSON. Revisa que el Web App esté desplegado con acceso \"Cualquier persona\".'\n          : '[rifa] GET: la respuesta no es JSON válido.',\n        texto.slice(0, 300)\n      );\n      throw errorDeDatos();\n    }\n\n    // 4. ¿Tiene la forma acordada? ok:true + numeros[] es conexión exitosa.\n    if(!data || data.ok !== true){\n      console.warn('[rifa] GET: el servidor respondió ok distinto de true.', data);\n      throw errorDeDatos();\n    }\n    if(!Array.isArray(data.numeros)){\n      console.warn('[rifa] GET: falta la propiedad \"numeros\" o no es un array.', data);\n      throw errorDeDatos();\n    }\n\n    console.info('[rifa] GET correcto: ' + data.numeros.length + ' números recibidos desde la hoja.');\n    return data.numeros.map(r=>this.mapRow(r));\n  },\n\n  // ESCRITURA — POST a [URL]/exec\n  // Devuelve la respuesta del servidor tal cual: submitForm decide\n  // según res.ok. La disponibilidad definitiva la valida Apps Script\n  // contra la hoja, nunca el navegador.\n  async reserveTickets(numeros, usuario){\n    const body = JSON.stringify({numeros, usuario});\n    let res, texto;\n\n    // Nota sobre el Content-Type: se probó 'application/json' contra este\n    // mismo endpoint y falla siempre. El navegador manda un preflight OPTIONS\n    // que los Web App de Apps Script no responden, así que la petición nunca\n    // llega al script. Con 'text/plain' no hay preflight y el POST pasa.\n    // El script lee el mismo JSON con JSON.parse(e.postData.contents),\n    // así que del lado de Apps Script no cambia nada.\n    try {\n      res = await fetch(API_URL, {\n        method: 'POST',\n        redirect: 'follow',\n        headers: {'Content-Type':'text/plain;charset=utf-8'},\n        body\n      });\n      texto = await res.text();\n    } catch(e){\n      console.warn('[rifa] POST: la petición no llegó a destino (red, CORS o bloqueo del navegador).', e);\n      throw errorDeRed();\n    }\n\n    if(!res.ok){\n      console.warn('[rifa] POST: el servidor respondió HTTP ' + res.status + '.', texto.slice(0, 300));\n      throw errorDeDatos();\n    }\n\n    let data;\n    try {\n      data = JSON.parse(texto);\n    } catch(e){\n      const parece = texto.trim().slice(0, 1).toLowerCase() === '<';\n      console.warn(\n        parece\n          ? '[rifa] POST: llegó HTML en vez de JSON. Revisa que el Web App esté desplegado con acceso \"Cualquier persona\".'\n          : '[rifa] POST: la respuesta no es JSON válido.',\n        texto.slice(0, 300)\n      );\n      throw errorDeDatos();\n    }\n\n    // ok:false es una respuesta válida del servidor, no un error: significa\n    // que rechazó la reserva. submitForm decide qué hacer con ella.\n    if(!data || typeof data.ok !== 'boolean'){\n      console.warn('[rifa] POST: falta la propiedad \"ok\" en la respuesta.', data);\n      throw errorDeDatos();\n    }\n\n    return data;\n  }\n};\n\n/* ───────────────────────── INTERFAZ ───────────────────────── */\n\nconst FIELD_DEFS = [\n  {key:'nombre', label:'Nombre', placeholder:'María Fernanda', mode:'text', span:'auto'},\n  {key:'apellido', label:'Apellido', placeholder:'Rojas', mode:'text', span:'auto'},\n  {key:'rut', label:'RUT', placeholder:'12.345.678-5', mode:'text', span:'auto'},\n  {key:'whatsapp', label:'WhatsApp', placeholder:'+56 9 1234 5678', mode:'tel', span:'auto'},\n  {key:'email', label:'Email', placeholder:'nombre@ayressecurity.cl', mode:'email', span:'1 / -1'}\n];\n\nconst RECAUDACION = 'Lo recaudado va en beneficio de nuestra colaboradora Cristy Gutiérrez.';\n\nconst STEPS = [\n  {n:1, text:'Eliges tus números en la grilla.'},\n  {n:2, text:'Completas tus datos y quedan reservados.'},\n  {n:3, text:'Recibes tu código de participación al instante.'}\n];\n\nconst BASES = [\n  {n:1, text:'El pago de la rifa será descontado por planilla.', destacado:true},\n  {n:2, text:'La rifa consta de 800 números, del 001 al 800, con un valor de $1.000 por número. Cada persona puede llevar la cantidad de números que quiera, mientras estén disponibles.'},\n  {n:3, text:'Se sortean tres premios entre los números vendidos: un televisor de 43 pulgadas, una freidora de aire y una gift card de $50.000. Un mismo número no puede ganar dos premios.'},\n  {n:4, text:'La compra de números finaliza el 16 de septiembre de 2026 a las 00:00 hrs. El sorteo se realiza el 17 de septiembre de 2026, durante la convivencia de Fiestas Patrias, de forma aleatoria y ante testigos designados por la organización. El resultado es único e inapelable.'},\n  {n:5, text:'Lo recaudado en esta rifa va íntegramente en beneficio de nuestra colaboradora Cristy Gutiérrez.'},\n  {n:6, text:'Las imágenes de los premios publicadas en esta plataforma son imágenes de referencia del producto. El modelo, la marca, el color y los accesorios del artículo entregado pueden diferir de lo mostrado, manteniendo siempre las características esenciales descritas: televisor de 43 pulgadas, freidora de aire y gift card de $50.000.'},\n  {n:7, text:'Los datos personales se utilizan únicamente para reservar los números y contactar a los ganadores, y no se comparten con terceros.'}\n];\n\nfunction cleanRut(v){ return (v||'').replace(/[^0-9kK]/g,'').toUpperCase(); }\nfunction formatRut(v){\n  const c = cleanRut(v);\n  if(c.length < 2) return c;\n  const body = c.slice(0,-1), dv = c.slice(-1);\n  return body.replace(/\\B(?=(\\d{3})+(?!\\d))/g,'.') + '-' + dv;\n}\nfunction validRut(v){\n  const c = cleanRut(v);\n  if(c.length < 8 || c.length > 9) return false;\n  const body = c.slice(0,-1), dv = c.slice(-1);\n  if(!/^\\d+$/.test(body)) return false;\n  let sum = 0, mul = 2;\n  for(let i = body.length-1; i >= 0; i--){ sum += parseInt(body[i],10)*mul; mul = mul === 7 ? 2 : mul+1; }\n  const rest = 11 - (sum % 11);\n  const expected = rest === 11 ? '0' : rest === 10 ? 'K' : String(rest);\n  return dv === expected;\n}\n\nconst VALIDATORS = {\n  nombre: (v)=> v.trim().length >= 2 ? null : 'Escribe tu nombre.',\n  apellido: (v)=> v.trim().length >= 2 ? null : 'Escribe tu apellido.',\n  rut: (v)=> validRut(v) ? null : 'Revisa el RUT, incluye el dígito verificador.',\n  whatsapp: (v)=> (v.replace(/[^0-9]/g,'').length >= 9) ? null : 'Ingresa un número de 9 dígitos.',\n  email: (v)=> /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(v.trim()) ? null : 'Ingresa un email válido.'\n};\n\nconst RANGE_SIZE = 100;\n\nclass Component extends DCLogic {\n  state = {\n    // La grilla arranca vacía: la disponibilidad la define la hoja,\n    // nunca el navegador.\n    tickets: [],\n    loadingTickets: true,\n    loadError: null,\n    selected: [],\n    rangeStart: 1,\n    query: '',\n    values: {nombre:'', apellido:'', rut:'', whatsapp:'', email:''},\n    touched: {},\n    loading: false,\n    reserveError: null,\n    confirmOpen: false,\n    confirmData: null,\n    toast: null,\n    now: Date.now()\n  };\n\n  componentDidMount(){\n    this._tick = setInterval(()=>this.setState({now:Date.now()}), 1000);\n    this.loadTickets();\n  }\n\n  // Trae la disponibilidad actual desde la hoja.\n  loadTickets = async ()=>{\n    this.setState({loadingTickets:true, loadError:null});\n    try {\n      const tickets = await RifaRepository.fetchTickets();\n      this.setState({tickets, loadingTickets:false, loadError:null});\n    } catch(e){\n      this.setState({loadingTickets:false, loadError: e.message || MSG_RED});\n    }\n  };\n  componentWillUnmount(){\n    clearInterval(this._tick);\n    clearTimeout(this._toastTimer);\n    clearTimeout(this._loadTimer);\n  }\n\n  scrollToId(id){\n    const el = document.getElementById(id);\n    if(el){ window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 84, behavior:'smooth'}); }\n  }\n  goPremios = ()=>this.scrollToId('premios');\n  goNumeros = ()=>this.scrollToId('numeros');\n  goSorteo = ()=>this.scrollToId('sorteo');\n  goBases = ()=>this.scrollToId('bases');\n  goParticipar = ()=>this.scrollToId('participar');\n  stopClick = (e)=>e.stopPropagation();\n\n  toggleNumber(numero){\n    this.setState(s=>{\n      const has = s.selected.indexOf(numero) !== -1;\n      const selected = has ? s.selected.filter(n=>n!==numero) : s.selected.concat([numero]);\n      selected.sort();\n      return {selected};\n    });\n  }\n  clearSelection = ()=>this.setState({selected:[]});\n  onQueryChange = (e)=>this.setState({query: e.target.value.replace(/[^0-9]/g,'').slice(0,3)});\n\n  setField(key, raw){\n    const value = key === 'rut' ? formatRut(raw) : raw;\n    this.setState(s=>({values:{...s.values, [key]:value}}));\n  }\n  touchField(key){ this.setState(s=>({touched:{...s.touched, [key]:true}})); }\n\n  dismissError = ()=>this.setState({reserveError:null});\n\n  submitForm = async ()=>{\n    if(this.state.loading) return;\n    this.setState({loading:true, reserveError:null});\n    const numeros = this.state.selected.slice();\n    const usuario = {...this.state.values};\n    // Piso de 500 ms para que el estado \"cargando\" no parpadee.\n    // No simula el resultado: la confirmación depende solo de la respuesta.\n    const piso = new Promise(r=>{ this._loadTimer = setTimeout(r, MIN_LOADING_MS); });\n\n    try {\n      const [res] = await Promise.all([\n        RifaRepository.reserveTickets(numeros, usuario),\n        piso\n      ]);\n\n      if(res.ok === true){\n        this.setState({\n          loading:false,\n          confirmOpen:true,\n          confirmData:{\n            numeros: res.numeros,\n            codigo: res.codigoParticipacion,\n            fechaReserva: res.fechaReserva,\n            estadoPago: res.estadoPago\n          }\n        });\n        return;\n      }\n\n      // ok:false — el servidor rechazó la reserva. No se muestra confirmación.\n      const noDisp = Array.isArray(res.numerosNoDisponibles)\n        ? res.numerosNoDisponibles.map(n=>String(n).padStart(3,'0'))\n        : [];\n      this.setState(s=>({\n        loading:false,\n        confirmOpen:false,\n        reserveError:{message: res.error || MSG_TOMADOS, numeros: noDisp},\n        // se mantienen seleccionados los que siguen disponibles\n        selected: noDisp.length ? s.selected.filter(n=>noDisp.indexOf(n) === -1) : s.selected\n      }));\n      this.loadTickets(); // refresca la grilla con la disponibilidad real\n\n    } catch(e){\n      // error de red o respuesta ilegible\n      this.setState({\n        loading:false,\n        confirmOpen:false,\n        reserveError:{message: e.message || MSG_RED, numeros: []}\n      });\n    }\n  };\n  closeConfirm = ()=>{\n    this.setState({\n      confirmOpen:false, confirmData:null, selected:[], reserveError:null,\n      values:{nombre:'', apellido:'', rut:'', whatsapp:'', email:''}, touched:{}\n    });\n    this.loadTickets(); // la hoja ya tiene esos números tomados\n    window.scrollTo({top:0, behavior:'smooth'});\n  };\n  shareTicket = ()=>{\n    this.setState({toast:'Enlace copiado para compartir'});\n    clearTimeout(this._toastTimer);\n    this._toastTimer = setTimeout(()=>this.setState({toast:null}), 2600);\n  };\n\n  renderVals(){\n    const s = this.state;\n    const cfg = RifaRepository.config;\n    const totalNumeros = this.props.totalNumeros ?? cfg.totalNumeros;\n    const precioNumero = this.props.precioNumero ?? cfg.precioNumero;\n    const nombreRifa = this.props.nombreRifa ?? cfg.nombre;\n    const showBases = this.props.showBases ?? true;\n\n    const nf = new Intl.NumberFormat('es-CL');\n    const money = (n)=> '$' + nf.format(n);\n\n    const tickets = s.tickets;\n    // Nada derivado de la disponibilidad se muestra hasta que la hoja respondió.\n    // Con la grilla vacía, \"0 disponibles\" sería mentir diciendo que se agotó.\n    const ticketsReady = !s.loadingTickets && !s.loadError && tickets.length > 0;\n    const ocupados = tickets.filter(t=>t.estado !== ESTADOS.DISPONIBLE).length;\n    const disponibles = Math.max(tickets.length - ocupados, 0);\n    const pct = ticketsReady ? Math.round(ocupados / tickets.length * 100) : 0;\n    const dash = '—';\n\n    // grilla visible: por rango de 100, o por búsqueda\n    const q = s.query;\n    let pool;\n    if(q){ pool = tickets.filter(t=> t.numero.indexOf(q) !== -1); }\n    else { pool = tickets.filter(t=>{ const n = parseInt(t.numero,10); return n >= s.rangeStart && n < s.rangeStart + RANGE_SIZE; }); }\n\n    const visibleNumbers = pool.map(t=>{\n      const isSel = s.selected.indexOf(t.numero) !== -1;\n      const taken = t.estado !== ESTADOS.DISPONIBLE;\n      return {\n        label: t.numero,\n        isSelected: isSel,\n        isTaken: taken,\n        isAvailable: !taken && !isSel,\n        onToggle: taken ? null : ()=>this.toggleNumber(t.numero)\n      };\n    });\n\n    const ranges = [];\n    for(let start = cfg.primerNumero; start <= totalNumeros; start += RANGE_SIZE){\n      const end = Math.min(start + RANGE_SIZE - 1, totalNumeros);\n      const active = !q && s.rangeStart === start;\n      ranges.push({\n        label: RifaRepository.padNumero(start) + '–' + RifaRepository.padNumero(end),\n        active, inactive: !active,\n        onSelect: ()=>this.setState({rangeStart:start, query:''})\n      });\n    }\n\n    const selectedCount = s.selected.length;\n    const total = selectedCount * precioNumero;\n    const selectedList = s.selected.map(n=>({label:n, onRemove: ()=>this.toggleNumber(n)}));\n\n    const fields = FIELD_DEFS.map(d=>{\n      const value = s.values[d.key];\n      const touched = !!s.touched[d.key];\n      const err = VALIDATORS[d.key](value);\n      const showError = touched && value.trim().length > 0 && !!err;\n      const showValid = !err && value.trim().length > 0;\n      return {\n        ...d, value, error: err || '',\n        stateError: showError, stateValid: showValid,\n        stateIdle: !showError && !showValid,\n        onChange: (e)=>this.setField(d.key, e.target.value),\n        onBlur: ()=>this.touchField(d.key)\n      };\n    });\n    const formValid = FIELD_DEFS.every(d=> !VALIDATORS[d.key](s.values[d.key]));\n    const canSubmit = formValid && selectedCount > 0;\n\n    // El contador apunta al cierre de compras, no al sorteo: es la fecha que\n    // le exige algo al usuario.\n    const diff = Math.max(0, new Date(cfg.fechaCierre).getTime() - s.now);\n    const cerrado = diff === 0;\n    const countdown = [\n      {label:'Días', value: Math.floor(diff/86400000)},\n      {label:'Horas', value: Math.floor((diff%86400000)/3600000)},\n      {label:'Minutos', value: Math.floor((diff%3600000)/60000)},\n      {label:'Segundos', value: Math.floor((diff%60000)/1000)}\n    ];\n\n    const cd = s.confirmData;\n\n    return {\n      nombreRifa, fechaSorteo: cfg.fechaSorteoTexto,\n      fechaCierreTexto: cfg.fechaCierreTexto,\n      tituloContador: cerrado ? 'Las compras ya están cerradas' : 'Quedan pocos días para participar',\n      totalNumerosFmt: nf.format(totalNumeros),\n      precioFmt: money(precioNumero),\n      primerNumero: RifaRepository.padNumero(cfg.primerNumero),\n      ultimoNumero: RifaRepository.padNumero(totalNumeros),\n      disponiblesFmt: ticketsReady ? nf.format(disponibles) : dash,\n      ocupadosFmt: ticketsReady ? nf.format(ocupados) : dash,\n      pct,\n      pctLabel: ticketsReady ? pct + '%' : dash,\n      estado: ticketsReady\n        ? (disponibles > 0 ? 'Rifa activa' : 'Números agotados')\n        : (s.loadError ? 'Sin conexión' : 'Cargando…'),\n      infoCards: [\n        {label:'Total de números', value: nf.format(totalNumeros) + ' números', note:'Del ' + RifaRepository.padNumero(cfg.primerNumero) + ' al ' + RifaRepository.padNumero(totalNumeros)},\n        {label:'Valor por número', value: money(precioNumero) + ' cada uno', note:'Sin límite de números por persona'},\n        {label:'Números disponibles',\n         value: ticketsReady ? nf.format(disponibles) : dash,\n         note: ticketsReady\n           ? nf.format(ocupados) + ' ya tomados · ' + pct + '% vendido'\n           : (s.loadError ? 'No pudimos cargar la disponibilidad' : 'Cargando disponibilidad…')},\n        {label:'Fecha del sorteo', value: '17 sep 2026', note:'En la convivencia de Fiestas Patrias'}\n      ],\n      countdown, steps: STEPS, showBases, recaudacion: RECAUDACION,\n      bases: BASES.map(b=>({...b, normal: !b.destacado, destacado: !!b.destacado})),\n\n      query: s.query, onQueryChange: this.onQueryChange,\n      ranges, showRanges: !q && !s.loadingTickets && !s.loadError,\n      visibleNumbers,\n      gridLoading: s.loadingTickets,\n      loadError: s.loadError,\n      retryLoad: this.loadTickets,\n      hasVisible: !s.loadingTickets && !s.loadError && visibleNumbers.length > 0,\n      noVisible: !s.loadingTickets && !s.loadError && visibleNumbers.length === 0,\n\n      reserveError: s.reserveError ? s.reserveError.message : null,\n      reserveErrorNums: s.reserveError ? s.reserveError.numeros.map(n=>({label:n})) : [],\n      hasReserveErrorNums: !!(s.reserveError && s.reserveError.numeros.length),\n      dismissError: this.dismissError,\n\n      selectedList, selectedCount,\n      hasSelection: selectedCount > 0, noSelection: selectedCount === 0,\n      totalFmt: money(total),\n      clearSelection: this.clearSelection,\n\n      fields,\n      btnLoading: s.loading,\n      btnReady: !s.loading && canSubmit,\n      btnDisabled: !s.loading && !canSubmit,\n      needsNumbers: !s.loading && formValid && selectedCount === 0,\n      submitForm: this.submitForm,\n\n      confirmOpen: s.confirmOpen,\n      confirmNumbers: cd ? cd.numeros.map(n=>({label:n})) : [],\n      confirmCount: cd ? cd.numeros.length : 0,\n      confirmTotal: cd ? money(cd.numeros.length * precioNumero) : money(0),\n      codigoParticipacion: cd ? cd.codigo : '',\n      confirmFecha: cd ? formatFechaReserva(cd.fechaReserva) : '',\n      confirmEstadoPago: cd ? etiquetaPago(cd.estadoPago) : '',\n      closeConfirm: this.closeConfirm, shareTicket: this.shareTicket,\n      toast: s.toast,\n\n      goPremios: this.goPremios, goNumeros: this.goNumeros, goSorteo: this.goSorteo,\n      goBases: this.goBases, goParticipar: this.goParticipar, stopClick: this.stopClick\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
